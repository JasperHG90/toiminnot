name: tests
description: "Template for running tests with pytest."

inputs:
    directory:
        description: "Path to tests."
        required: true
    uv_version:
        description: "uv version to use."
        required: false
        default: '0.7.x'
    python_version:
        description: "Python version to use."
        required: false
        default: "3.11"
    markers:
        description: "Pytest markers to use."
        required: false
        default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: ${{ inputs.uv_version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: install dependencies
      run: |
        uv sync --all-extras --all-groups
      shell: bash
    - name: run tests
      env:
        TESTS_DIRECTORY: ${{ inputs.directory }}
        TESTS_MARKERS: ${{ inputs.markers }}
      run: |
        set -euo pipefail
        # An empty -m clears the project's own marker filter (addopts), so
        # pass -m only when the caller sets markers.
        args=("$TESTS_DIRECTORY" -v --color=yes --tb=short)
        if [ -n "$TESTS_MARKERS" ]; then
          args+=(-m "$TESTS_MARKERS")
        fi
        uv run pytest "${args[@]}"
      shell: bash
